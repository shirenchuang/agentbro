name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:run
      - run: pnpm build

  backend:
    name: Backend (fmt + clippy + test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install system dependencies
        run: |
          brew install pkg-config
      - name: Prepare bridge resource
        run: |
          mkdir -p src-tauri/target/agentbro-bridge-resource
          touch src-tauri/target/agentbro-bridge-resource/agentbro-bridge
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  windows-check:
    name: Windows (Rust check)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo check --locked --tests --manifest-path src-tauri/Cargo.toml
      - name: Prepare Windows Rust test executable
        shell: pwsh
        run: |
          $testExecutable = cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json |
            ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable } |
            Select-Object -ExpandProperty executable
          if ($LASTEXITCODE -ne 0 -or @($testExecutable).Count -ne 1) {
            throw 'Could not build and locate the Rust library test executable'
          }

          $manifest = Join-Path $env:RUNNER_TEMP 'agentbro-rust-tests.manifest'
          @'
          <?xml version="1.0" encoding="UTF-8" standalone="yes"?>
          <assembly xmlns="urn:schemas-microsoft-com:asm.v1" manifestVersion="1.0">
            <dependency>
              <dependentAssembly>
                <assemblyIdentity type="win32" name="Microsoft.Windows.Common-Controls" version="6.0.0.0"
                  processorArchitecture="*" publicKeyToken="6595b64144ccf1df" language="*" />
              </dependentAssembly>
            </dependency>
          </assembly>
          '@ | Set-Content -LiteralPath $manifest -Encoding utf8

          $manifestTool = Get-Item "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          & $manifestTool.FullName -nologo -manifest $manifest "-outputresource:$testExecutable;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "AGENTBRO_WINDOWS_AGENT_TEST_EXE=$testExecutable" >> $env:GITHUB_ENV
      - name: Test Agent program management
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE agents::programs'
      - name: Test Agent launcher discovery
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE agents::executable::tests'
      - name: Test pinned GitHub Skill resolution
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE skills::installer::tests::pinned_github_'
      - name: Test Hook bridge repair
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE agents::hook_manager::tests'
      - name: Test shared Antigravity Hook recovery
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE shared_antigravity_hook_'
      - name: Test concurrent Island preference saves
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE config::tests::island_preferences_'
      - name: Test Hook Doctor and the active Qoder CLI profile
        run: |
          & $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE commands::tests::hook_doctor_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE agents::qoder_cli::tests
      - name: Test Qoder sessions and permission responses
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE hooks::server::tests::qoder_'
      - name: Test Hook question and plan responses
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE hooks::server::tests::hook_reply_'
      - name: Test the native startup recovery dialog
        timeout-minutes: 2
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE platform::windows_startup::tests'
      - name: Test native Codex Desktop jump fallback
        timeout-minutes: 2
        run: |
          & $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE --exact platform::windows_shell::tests::windows_shell_resolves_registered_protocols
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE --exact commands::tests::windows_codex_jump_falls_back_when_the_protocol_and_package_are_unavailable
      - name: Test native JSON Hook settings edits
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE agents::profiles::tests::json_hook_'
      - name: Test session snapshot ordering
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE --exact hooks::session_store::tests::pushed_and_polled_session_snapshots_share_revisions_across_store_clones'
      - name: Test Agent and Skill metadata writes
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE skills::registry::tests'
      - name: Test verification and restore of locked project Skills
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE skills::v2::project_lock::tests'
      - name: Test offline Skill Pack ZIP migration
        run: |
          & $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE skills::v2::pack_archive::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE skills::v2::tests::offline_skill_pack_
      - name: Test first-run configuration saves
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE config::tests::first_run_setup_'
      - name: Test OpenCode MCP configuration discovery
        run: '& $env:AGENTBRO_WINDOWS_AGENT_TEST_EXE skills::mcp_management::opencode::tests'
