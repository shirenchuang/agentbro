name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: write

jobs:
  build-universal:
    name: Build Universal DMG
    runs-on: macos-15
    timeout-minutes: 360
    env:
      HAS_APPLE_SECRETS: ${{ secrets.APPLE_ID != '' && '1' || '0' }}
      HAS_OSS_SECRETS: ${{ secrets.OSS_ACCESS_KEY_ID != '' && secrets.OSS_ACCESS_KEY_SECRET != '' && '1' || '0' }}
      OSS_BUCKET: agentbro
      OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Classify release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "$VERSION" == *-* ]]; then
            echo "IS_PRERELEASE=1" >> "$GITHUB_ENV"
            echo "ALLOW_UNSIGNED_RELEASE=1" >> "$GITHUB_ENV"
            echo "SKIP_SIGN=1" >> "$GITHUB_ENV"
            echo "SKIP_NOTARIZE=1" >> "$GITHUB_ENV"
          else
            echo "IS_PRERELEASE=0" >> "$GITHUB_ENV"
            echo "ALLOW_UNSIGNED_RELEASE=0" >> "$GITHUB_ENV"
            echo "SKIP_SIGN=0" >> "$GITHUB_ENV"
            if [ "$HAS_APPLE_SECRETS" = "1" ]; then
              echo "SKIP_NOTARIZE=0" >> "$GITHUB_ENV"
            else
              echo "SKIP_NOTARIZE=1" >> "$GITHUB_ENV"
            fi
          fi

      - name: Release readiness check
        env:
          CI_RELEASE: '1'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AGENTBRO_TELEMETRY_SLS_HOST: ${{ secrets.AGENTBRO_TELEMETRY_SLS_HOST }}
          AGENTBRO_TELEMETRY_SLS_PROJECT: ${{ secrets.AGENTBRO_TELEMETRY_SLS_PROJECT }}
          AGENTBRO_TELEMETRY_SLS_LOGSTORE: ${{ secrets.AGENTBRO_TELEMETRY_SLS_LOGSTORE }}
        run: pnpm release:check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI and create-dmg
        run: |
          cargo install tauri-cli --locked
          if ! command -v create-dmg >/dev/null 2>&1; then
            brew install create-dmg
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Import signing certificate
        if: ${{ !contains(github.ref_name, '-') && env.HAS_APPLE_SECRETS == '1' }}
        timeout-minutes: 5
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Build universal DMG
        timeout-minutes: 330
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AGENTBRO_TELEMETRY_SLS_HOST: ${{ secrets.AGENTBRO_TELEMETRY_SLS_HOST }}
          AGENTBRO_TELEMETRY_SLS_PROJECT: ${{ secrets.AGENTBRO_TELEMETRY_SLS_PROJECT }}
          AGENTBRO_TELEMETRY_SLS_LOGSTORE: ${{ secrets.AGENTBRO_TELEMETRY_SLS_LOGSTORE }}
          NOTARY_TIMEOUT_SECONDS: '18000'
          NOTARY_POLL_SECONDS: '60'
        run: |
          export APP_VERSION="$VERSION"
          export DMG_NAME="AgentBro_${VERSION}_universal.dmg"
          export UPDATE_BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          mkdir -p dist
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-notes.md > dist/release-notes.md
          export RELEASE_NOTES="$(cat dist/release-notes.md)"
          {
            echo "RELEASE_NOTES<<AGENTBRO_RELEASE_NOTES"
            cat dist/release-notes.md
            echo "AGENTBRO_RELEASE_NOTES"
          } >> "$GITHUB_ENV"
          if [ "$IS_PRERELEASE" = "1" ]; then
            bash build.sh
          else
            bash build.sh --notarize
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Create latest DMG alias
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          cp "dist/${DMG_NAME}" "dist/AgentBro_latest_universal.dmg"
          shasum -a 256 "dist/AgentBro_latest_universal.dmg" >> dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AgentBro_*_universal.dmg
            dist/AgentBro.app.tar.gz
            dist/AgentBro.app.tar.gz.sig
            dist/latest.json
            dist/checksums.txt
          body: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Mirror release to Aliyun OSS
        if: ${{ !contains(github.ref_name, '-') && env.HAS_OSS_SECRETS == '1' }}
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | bash
          OSSUTIL="$(command -v ossutil || echo /usr/local/bin/ossutil)"

          GH_PREFIX="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          OSS_HTTP_PREFIX="https://${OSS_BUCKET}.${OSS_ENDPOINT}"
          # latest.json on OSS must point updater archives at OSS, not GitHub.
          sed "s#${GH_PREFIX}#${OSS_HTTP_PREFIX}#g" dist/latest.json > dist/latest.oss.json

          oss_cp() {
            "$OSSUTIL" cp -f -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET" "$1" "$2"
          }
          base="oss://${OSS_BUCKET}"
          oss_cp "dist/${DMG_NAME}"                      "${base}/releases/v${VERSION}/${DMG_NAME}"
          oss_cp "dist/AgentBro_latest_universal.dmg"    "${base}/AgentBro_latest_universal.dmg"
          oss_cp "dist/AgentBro.app.tar.gz"              "${base}/AgentBro.app.tar.gz"
          oss_cp "dist/AgentBro.app.tar.gz.sig"          "${base}/AgentBro.app.tar.gz.sig"
          oss_cp "dist/latest.oss.json"                  "${base}/latest.json"

  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest
    needs: build-universal
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Release readiness check
        run: pnpm release:check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installers
        shell: pwsh
        run: |
          pnpm tauri:build:windows

          $windowsDist = "dist/windows"
          New-Item -ItemType Directory -Force -Path $windowsDist | Out-Null

          $nsisDir = "src-tauri/target/release/bundle/nsis"
          $msiDir = "src-tauri/target/release/bundle/msi"
          $nsisFiles = if (Test-Path $nsisDir) { @(Get-ChildItem -Path $nsisDir -Filter "*.exe" -File) } else { @() }
          $msiFiles = if (Test-Path $msiDir) { @(Get-ChildItem -Path $msiDir -Filter "*.msi" -File) } else { @() }
          $installerFiles = @($nsisFiles + $msiFiles)

          if ($installerFiles.Count -eq 0) {
            throw "No Windows installer artifacts were produced."
          }

          foreach ($file in $installerFiles) {
            Copy-Item -LiteralPath $file.FullName -Destination $windowsDist
          }

          if ("${{ github.ref_name }}" -notlike "*-*") {
            $latestExe = $nsisFiles | Sort-Object Name | Select-Object -First 1
            if ($latestExe) {
              Copy-Item -LiteralPath $latestExe.FullName -Destination "$windowsDist/AgentBro_latest_x64-setup.exe"
            }

            $latestMsi = $msiFiles | Sort-Object Name | Select-Object -First 1
            if ($latestMsi) {
              Copy-Item -LiteralPath $latestMsi.FullName -Destination "$windowsDist/AgentBro_latest_x64.msi"
            }
          }

          Get-ChildItem -Path $windowsDist -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -Path "$windowsDist/checksums-windows.txt" -Encoding ascii

          Get-ChildItem -Path $windowsDist -File | Sort-Object Name

      - name: Upload Windows installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows/*.exe
            dist/windows/*.msi
            dist/windows/checksums-windows.txt
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  update-homebrew:
    name: Update Homebrew Cask
    runs-on: ubuntu-latest
    needs: build-universal
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    env:
      HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' && '1' || '0' }}
      HAS_OSS_SECRETS: ${{ secrets.OSS_ACCESS_KEY_ID != '' && secrets.OSS_ACCESS_KEY_SECRET != '' && '1' || '0' }}
      OSS_BUCKET: agentbro
      OSS_ENDPOINT: oss-cn-hangzhou.aliyuncs.com

    steps:
      - name: Skip Homebrew update
        if: env.HAS_HOMEBREW_TAP_TOKEN != '1'
        run: echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew cask update."

      - name: Extract version
        if: env.HAS_HOMEBREW_TAP_TOKEN == '1'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Download DMG from release
        if: env.HAS_HOMEBREW_TAP_TOKEN == '1'
        run: |
          DMG_NAME="AgentBro_${VERSION}_universal.dmg"
          curl -L \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${DMG_NAME}" \
            -o "${DMG_NAME}"
          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV

      - name: Compute SHA256
        if: env.HAS_HOMEBREW_TAP_TOKEN == '1'
        run: echo "SHA256=$(sha256sum "${DMG_NAME}" | awk '{print $1}')" >> $GITHUB_ENV

      - name: Clone homebrew-tap
        if: env.HAS_HOMEBREW_TAP_TOKEN == '1'
        run: |
          git clone \
            "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/${{ github.repository_owner }}/homebrew-tap.git" \
            homebrew-tap

      - name: Update Cask formula
        if: env.HAS_HOMEBREW_TAP_TOKEN == '1'
        run: |
          mkdir -p homebrew-tap/Casks
          if [ "$HAS_OSS_SECRETS" = "1" ]; then
            CASK_URL="https://${OSS_BUCKET}.${OSS_ENDPOINT}/releases/v#{version}/AgentBro_#{version}_universal.dmg"
          else
            CASK_URL="https://github.com/${{ github.repository }}/releases/download/v#{version}/AgentBro_#{version}_universal.dmg"
          fi
          cat > homebrew-tap/Casks/agentbro.rb <<CASK_EOF
          cask "agentbro" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "${CASK_URL}"
            name "AgentBro"
            desc "Menu bar companion for Claude Code, Codex, Gemini CLI and more"
            homepage "https://www.agentbro.net"

            livecheck do
              url "https://github.com/${{ github.repository }}/releases/latest"
              strategy :github_latest
            end

            depends_on macos: ">= :sonoma"

            app "AgentBro.app"

            zap trash: [
              "~/.agentbro",
              "~/Library/Application Support/com.agentbro.desktop",
              "~/Library/Preferences/com.agentbro.desktop.plist",
            ]
          end
          CASK_EOF

      - name: Commit and push
        if: env.HAS_HOMEBREW_TAP_TOKEN == '1'
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/agentbro.rb
          if git diff --cached --quiet; then
            echo "Homebrew cask already up to date"
          else
            git commit -m "Update agentbro to ${VERSION}"
            git push
          fi
