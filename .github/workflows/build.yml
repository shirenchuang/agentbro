name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      windows_artifact_run:
        description: Existing Build run ID for an installer-only smoke test
        type: string
      windows_smoke_runner:
        description: Windows image for the installer smoke test
        type: choice
        default: windows-latest
        options:
          - windows-latest
          - windows-2022
          - windows-11-arm

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.windows_artifact_run }}
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: arm64
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            rust-target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Release readiness check
        run: pnpm release:check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        run: |
          mkdir -p target/agentbro-bridge-resource
          touch target/agentbro-bridge-resource/agentbro-bridge
          cargo build --release --target ${{ matrix.rust-target }}
        working-directory: src-tauri

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentbro-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.rust-target }}/release/agentbro
          if-no-files-found: error

  build-windows:
    if: ${{ !inputs.windows_artifact_run }}
    name: Build Windows installers
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Release readiness check
        run: pnpm release:check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installers
        run: pnpm tauri:build:windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentbro-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/agentbro.pdb
          if-no-files-found: error

      - name: Test Windows Agents, Skills, and MCP
        shell: pwsh
        run: |
          $testExecutable = cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json |
            ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable } |
            Select-Object -ExpandProperty executable
          if ($LASTEXITCODE -ne 0 -or @($testExecutable).Count -ne 1) {
            throw 'Could not build and locate the Rust library test executable'
          }

          $manifestTool = Get-Item "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          $appExecutable = (Resolve-Path 'src-tauri/target/release/agentbro.exe').Path
          # The library test executable needs the same Common Controls v6 manifest as the app.
          & $manifestTool.FullName -nologo "-inputresource:$appExecutable;#1" "-outputresource:$testExecutable;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable skills::v2::tests::windows_skill_paths_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable skills::v2::fsutil::windows_shell::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable source_update
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable skills::sync::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable hooks::server::tests::permission_responses_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact hooks::server::tests::harness_turn_and_permission_round_trip_share_the_island_session
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable agents::executable::tests::windows_
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact agents::copilot::tests::finds_local_copilot_installations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact agents::programs::tests::windows_qwenwork_candidates_include_the_packaged_launcher
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $qwenworkTest = 'hooks::qwenwork_watcher::tests::mirrors_qwenwork_turn_phases_without_owning_approvals'
          if (-not (& $testExecutable --list $qwenworkTest --exact | Select-String -SimpleMatch "${qwenworkTest}: test" -Quiet)) {
            throw 'The QwenWork watcher test was not compiled for Windows'
          }
          & $testExecutable --exact $qwenworkTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact agents::programs::tests::windows_workbuddy_launchers_match_the_two_installer_editions
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact agents::profiles::tests::workbuddy_ai_hooks_use_separate_settings_and_observe_confirmations
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact hooks::server::tests::workbuddy_sessions_outlive_the_hook_shell
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable platform::wsl::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable skills::v2::project_lock::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact hooks::server::tests::wsl_hooks_isolate_sessions_and_ignore_windows_process_ids
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact skills::installer::tests::temporary_import_directories_have_independent_lifetimes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact skills::v2::tests::add_center_skill_from_zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --ignored --exact agents::profiles::tests::windows_claude_hook_keeps_paths_through_git_bash
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable --exact skills::mcp_management::tests::windows_stdio_mcp_checks_run_without_a_console
          exit $LASTEXITCODE

  compile-startup-sampler:
    name: Build the Windows startup sampler
    if: inputs.windows_smoke_runner != 'windows-11-arm'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile a local Windows stack sampler
        shell: pwsh
        timeout-minutes: 5
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'The hosted runner is missing the Visual C++ toolset' }
          & (Join-Path $vs 'Common7\Tools\Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          $source = Join-Path $PWD 'scripts/windows-startup-stacks.cpp'
          Push-Location $env:RUNNER_TEMP
          try {
            cl.exe /nologo /std:c++17 /EHsc /W4 /WX $source /link dbghelp.lib
            if ($LASTEXITCODE -ne 0) { throw 'Could not compile the Windows startup sampler' }
          } finally {
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: agentbro-windows-startup-sampler
          path: ${{ runner.temp }}/windows-startup-stacks.exe
          if-no-files-found: error

  smoke-windows:
    name: Sample Windows startup after ${{ matrix.delay }}s (trial ${{ matrix.trial }})
    if: ${{ !cancelled() && (inputs.windows_artifact_run || needs.build-windows.result == 'success') && (needs.compile-startup-sampler.result == 'success' || inputs.windows_smoke_runner == 'windows-11-arm') }}
    runs-on: ${{ inputs.windows_smoke_runner || 'windows-latest' }}
    needs: [build-windows, compile-startup-sampler]
    strategy:
      fail-fast: false
      matrix:
        delay: [0, 20]
        trial: [1, 2, 3]
    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agentbro-windows-installers
          path: windows-installers
          github-token: ${{ inputs.windows_artifact_run && github.token || '' }}
          run-id: ${{ inputs.windows_artifact_run || github.run_id }}

      - uses: actions/download-artifact@v4
        if: runner.arch == 'X64'
        with:
          name: agentbro-windows-startup-sampler
          path: ${{ runner.temp }}

      - name: Clear first-sign-in setup on the hosted Windows 11 runner
        if: inputs.windows_smoke_runner == 'windows-11-arm' && runner.environment == 'github-hosted'
        shell: pwsh
        run: |
          $policy = 'HKCU:\Software\Policies\Microsoft\Windows\OOBE'
          New-Item -Path $policy -Force | Out-Null
          New-ItemProperty -Path $policy -Name DisablePrivacyExperience -PropertyType DWord -Value 1 -Force | Out-Null
          $session = [System.Diagnostics.Process]::GetCurrentProcess().SessionId
          Get-Process -Name WWAHost -ErrorAction SilentlyContinue |
            Where-Object { $_.SessionId -eq $session } |
            Stop-Process
          # The Start menu can open as Windows finishes the first sign-in.
          Start-Sleep -Milliseconds 1500
          (New-Object -ComObject WScript.Shell).SendKeys('{ESC}')
          (New-Object -ComObject Shell.Application).MinimizeAll()

      - name: Install and exercise the Windows app
        if: runner.arch != 'X64'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem -Path windows-installers -Recurse -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) {
              throw 'Windows NSIS installer was not found in the build artifact'
          }
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName -VerifyIsland `
              -SymbolsDirectory (Join-Path $PWD 'windows-installers')

      - name: Exercise the installed app and capture native startup waits
        if: runner.arch == 'X64'
        shell: pwsh
        timeout-minutes: 9
        env:
          STARTUP_TRIAL_DELAY_SECONDS: ${{ matrix.delay }}
        run: |
          $installer = Get-ChildItem -Path windows-installers -Recurse -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows NSIS installer was not found' }
          $shell = (Get-Process -Id $PID).Path
          $stackSampler = Join-Path $env:RUNNER_TEMP 'windows-startup-stacks.exe'
          $symbols = Join-Path $PWD 'windows-installers'
          $delay = [int]$env:STARTUP_TRIAL_DELAY_SECONDS
          Write-Output "Waiting $delay seconds before the first installation and launch."
          if ($delay) { Start-Sleep -Seconds $delay }
          $passed = 0
          foreach ($attempt in 1..4) {
            if ($attempt -gt 2) {
              $env:WEBVIEW2_USER_DATA_FOLDER = Join-Path $env:RUNNER_TEMP "AgentBro WebView2 profile $attempt"
            }
            Write-Output "::group::Installed Windows startup attempt $attempt"
            & $shell -NoProfile -NonInteractive -File ./scripts/test-windows-installer.ps1 `
              -Installer $installer.FullName -VerifyIsland -SymbolsDirectory $symbols `
              -StartupStackSampler $stackSampler -VerifyStartupStackSampler
            if ($LASTEXITCODE -eq 0) { $passed += 1 }
            Write-Output "::endgroup::"
          }
          if ($passed -ne 4) { throw "$passed of 4 installed Windows startup attempts passed" }

      - name: Upload the failed desktop check
        if: failure() && runner.environment == 'github-hosted'
        uses: actions/upload-artifact@v4
        with:
          name: agentbro-windows-startup-failure-${{ matrix.delay }}s-${{ matrix.trial }}
          path: ${{ runner.temp }}/agentbro-island-failure.png
          if-no-files-found: ignore
