name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build macOS (${{ matrix.arch }})
    runs-on: macos-15
    strategy:
      matrix:
        include:
          - arch: arm64
            rust-target: aarch64-apple-darwin
          - arch: x86_64
            rust-target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Release readiness check
        run: pnpm release:check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Build Tauri app
        run: |
          mkdir -p target/agentbro-bridge-resource
          touch target/agentbro-bridge-resource/agentbro-bridge
          cargo build --release --target ${{ matrix.rust-target }}
        working-directory: src-tauri

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentbro-${{ matrix.arch }}
          path: src-tauri/target/${{ matrix.rust-target }}/release/agentbro
          if-no-files-found: error

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Release readiness check
        run: pnpm release:check

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installers
        run: pnpm tauri:build:windows

      - name: Test Windows skill paths
        shell: pwsh
        run: |
          $testExecutable = cargo test --release --locked --manifest-path src-tauri/Cargo.toml --lib --no-run --message-format=json |
            ForEach-Object { ConvertFrom-Json -InputObject $_ } |
            Where-Object { $_.reason -eq 'compiler-artifact' -and $_.profile.test -and $_.executable } |
            Select-Object -ExpandProperty executable
          if ($LASTEXITCODE -ne 0 -or @($testExecutable).Count -ne 1) {
            throw 'Could not build and locate the Rust library test executable'
          }

          $manifestTool = Get-Item "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\mt.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending |
            Select-Object -First 1
          $appExecutable = (Resolve-Path 'src-tauri/target/release/agentbro.exe').Path
          # The library test executable needs the same Common Controls v6 manifest as the app.
          & $manifestTool.FullName -nologo "-inputresource:$appExecutable;#1" "-outputresource:$testExecutable;#1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & $testExecutable skills::v2::tests::windows_skill_paths_
          exit $LASTEXITCODE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentbro-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  smoke-windows:
    name: Smoke test installed Windows app
    runs-on: windows-latest
    needs: build-windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agentbro-windows-installers
          path: windows-installers

      - name: Install and exercise the Windows app
        shell: pwsh
        timeout-minutes: 5
        run: |
          $installer = Get-ChildItem -Path windows-installers -Recurse -Filter '*-setup.exe' -File | Select-Object -First 1
          if (-not $installer) {
              throw 'Windows NSIS installer was not found in the build artifact'
          }
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName
