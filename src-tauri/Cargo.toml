[package]
name = "agentbro"
version = "0.1.0"
description = "Your AI agents' best bro — monitor, manage, and supercharge every coding agent from one native app"
authors = ["AgentBro"]
edition = "2021"
default-run = "agentbro"

[lib]
name = "agentbro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "agentbro-bridge"
path = "src/bridge/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
rodio = "0.19"
notify = { version = "7", features = ["macos_kqueue"] }
zip = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow"] }
