[package]
name = "agentbro"
version = "0.1.0"
description = "Your AI agents' best bro — monitor, manage, and supercharge every coding agent from one native app"
authors = ["AgentBro"]
edition = "2021"
default-run = "agentbro"

[lib]
name = "agentbro_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "agentbro-bridge"
path = "src/bridge/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dashmap = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "2"
libc = "0.2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
base64 = "0.22"
rodio = "0.19"
notify = "7"
zip = "2"
tauri-plugin-dialog = "2"
axum = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-plugin-deep-link = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.3", features = ["std", "NSWindow", "NSApplication", "NSImage", "NSDockTile"] }
objc2-foundation = { version = "0.3", features = ["objc2-core-foundation"] }
