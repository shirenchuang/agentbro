<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Noto Sans SC, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="layer1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="layer4Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="800" fill="url(#bgGrad)"/>

  <text x="640" y="58" text-anchor="middle" fill="#F8FAFC" font-size="32" font-weight="700">AgentBro 宠物市场 · 整体架构</text>
  <text x="640" y="86" text-anchor="middle" fill="#94A3B8" font-size="16">四层流水线：来源 → 存储 → 适配 → 应用</text>

  <ellipse cx="640" cy="430" rx="560" ry="280" fill="url(#glow)"/>

  <g filter="url(#softShadow)">
    <rect x="120" y="130" width="1040" height="120" rx="20" fill="url(#layer1Grad)"/>
    <rect x="120" y="270" width="1040" height="120" rx="20" fill="url(#layer2Grad)"/>
    <rect x="120" y="410" width="1040" height="120" rx="20" fill="url(#layer3Grad)"/>
    <rect x="120" y="550" width="1040" height="120" rx="20" fill="url(#layer4Grad)"/>
  </g>

  <g>
    <rect x="160" y="160" width="240" height="60" rx="12" fill="#FFFFFF" opacity="0.18"/>
    <text x="280" y="190" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600">codex</text>
    <text x="280" y="210" text-anchor="middle" fill="#E9D5FF" font-size="13">内置 Pet</text>

    <rect x="420" y="160" width="240" height="60" rx="12" fill="#FFFFFF" opacity="0.18"/>
    <text x="540" y="190" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600">user</text>
    <text x="540" y="210" text-anchor="middle" fill="#E9D5FF" font-size="13">用户目录</text>

    <rect x="680" y="160" width="240" height="60" rx="12" fill="#FFFFFF" opacity="0.18"/>
    <text x="800" y="190" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="600">agentpro</text>
    <text x="800" y="210" text-anchor="middle" fill="#E9D5FF" font-size="13">市场下载</text>
  </g>

  <text x="980" y="200" text-anchor="middle" fill="#FFFFFF" font-size="14" opacity="0.8">+ 更多源</text>

  <g>
    <rect x="160" y="300" width="760" height="60" rx="12" fill="#FFFFFF" opacity="0.18"/>
    <text x="540" y="330" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">~/.agentbro/pets/&lt;pet-id&gt;</text>
    <text x="540" y="350" text-anchor="middle" fill="#CFFAFE" font-size="13">pet.json + spritesheet.webp|png</text>

    <rect x="940" y="300" width="180" height="60" rx="12" fill="#FFFFFF" opacity="0.25"/>
    <text x="1030" y="335" text-anchor="middle" fill="#FFFFFF" font-size="14" font-weight="600">pet-market-sources.json</text>
  </g>

  <g>
    <rect x="160" y="440" width="280" height="60" rx="12" fill="#FFFFFF" opacity="0.20"/>
    <text x="300" y="470" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">manifest 拉取</text>
    <text x="300" y="490" text-anchor="middle" fill="#FEF3C7" font-size="12">HTTP · GitHub</text>

    <rect x="460" y="440" width="280" height="60" rx="12" fill="#FFFFFF" opacity="0.20"/>
    <text x="600" y="470" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">下载 + 校验</text>
    <text x="600" y="490" text-anchor="middle" fill="#FEF3C7" font-size="12">大小限制 · 完整性</text>

    <rect x="760" y="440" width="360" height="60" rx="12" fill="#FFFFFF" opacity="0.20"/>
    <text x="940" y="470" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">签名校验（可选）</text>
    <text x="940" y="490" text-anchor="middle" fill="#FEF3C7" font-size="12">未来支持 · 公钥校验</text>
  </g>

  <g>
    <rect x="160" y="580" width="280" height="60" rx="12" fill="#FFFFFF" opacity="0.20"/>
    <text x="300" y="610" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">Dynamic Island</text>
    <text x="300" y="630" text-anchor="middle" fill="#D1FAE5" font-size="12">动态岛渲染</text>

    <rect x="460" y="580" width="280" height="60" rx="12" fill="#FFFFFF" opacity="0.20"/>
    <text x="600" y="610" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">设置 · Pet 面板</text>
    <text x="600" y="630" text-anchor="middle" fill="#D1FAE5" font-size="12">浏览 · 搜索 · 安装</text>

    <rect x="760" y="580" width="360" height="60" rx="12" fill="#FFFFFF" opacity="0.20"/>
    <text x="940" y="610" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="600">Pet 上传</text>
    <text x="940" y="630" text-anchor="middle" fill="#D1FAE5" font-size="12">本地 → 官方市场</text>
  </g>

  <g stroke="#F8FAFC" stroke-width="2" fill="none" opacity="0.55">
    <line x1="640" y1="250" x2="640" y2="270"/>
    <line x1="640" y1="390" x2="640" y2="410"/>
    <line x1="640" y1="530" x2="640" y2="550"/>
  </g>
  <g fill="#F8FAFC" opacity="0.7">
    <polygon points="635,265 645,265 640,275"/>
    <polygon points="635,405 645,405 640,415"/>
    <polygon points="635,545 645,545 640,555"/>
  </g>

  <g font-size="14" fill="#F1F5F9">
    <text x="148" y="200" text-anchor="end">Pet 来源</text>
    <text x="148" y="335" text-anchor="end">本地存储</text>
    <text x="148" y="475" text-anchor="end">市场适配</text>
    <text x="148" y="615" text-anchor="end">应用层</text>
  </g>

  <g font-size="13" fill="#E2E8F0">
    <text x="160" y="115">L1</text>
    <text x="160" y="255">L2</text>
    <text x="160" y="395">L3</text>
    <text x="160" y="535">L4</text>
  </g>

  <rect x="120" y="700" width="1040" height="60" rx="14" fill="#FFFFFF" opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.2"/>
  <text x="640" y="725" text-anchor="middle" fill="#F8FAFC" font-size="14">下载即用 · 本地缓存 · 自动发现 · 命名空间隔离（provider:id）</text>
  <text x="640" y="748" text-anchor="middle" fill="#94A3B8" font-size="12">discover_agentbro_pets() 扫描 ~/.agentbro/pets，无需重启即可生效</text>
</svg>
